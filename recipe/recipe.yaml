schema_version: 1

context:
  version: "2.0.5"

package:
  name: akamai
  version: ${{ version }}

source:
  url: https://github.com/akamai/cli/archive/v${{ version }}.tar.gz
  sha256: 42d47d0fdf4c737cf0cdfd882877f6e91bf416bb165b03acbce5c3d82aada299

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - akamai --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files/
  summary: CLI toolkit for working with Akamai's APIs
  homepage: https://github.com/akamai/cli
  repository: https://github.com/akamai/cli

extra:
  recipe-maintainers:
    - danielnachun
