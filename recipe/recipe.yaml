schema_version: 1

context:
  version: "2.0.6"

package:
  name: akamai
  version: ${{ version }}

source:
  url: https://github.com/akamai/cli/archive/v${{ version }}.tar.gz
  sha256: fb614f97f816a7517f94d46a4a3eca74459f12db22245a0a96e3325aa1f3308a

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - akamai --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files/
  summary: CLI toolkit for working with Akamai's APIs
  homepage: https://github.com/akamai/cli
  repository: https://github.com/akamai/cli

extra:
  recipe-maintainers:
    - danielnachun
